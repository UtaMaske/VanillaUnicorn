<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagerverwaltung</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <nav id="main-nav">
            <button onclick="window.location.href='Index.html'" class="nav-btn">Kasse</button>
            <button onclick="window.location.href='dashboard.html'" class="nav-btn">📊 Dashboard</button>
            <button class="nav-btn active">📦 Lager</button>
            <button id="nav-company-settings" class="nav-btn" style="display: none;" onclick="window.location.href='company-settings.html'">🏢 Unternehmen</button>
        </nav>
        <div class="user-info">
            <span id="user-display">Lade...</span>
            <span id="user-role" class="role-badge"></span>
            <button id="btn-logout">Abmelden</button>
        </div>
    </header>

    <main class="dashboard-container">
        <h1>Lagerverwaltung</h1>
        <div class="view-toggle" style="margin-bottom:12px;">
            <button id="btn-storage-chart" class="active">📊 Diagramm</button>
            <button id="btn-storage-list">📋 Liste</button>
        </div>
        <div class="table-wrapper" style="background: white; padding: 12px; border-radius: 8px;">
            <div id="storage-chart-container" style="display:none; padding:12px; background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.04); margin-bottom:12px;">
                <canvas id="storage-chart" style="width:100%; height:420px;"></canvas>
            </div>
            <table id="storage-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Kategorie</th>
                        <th>Unterkategorie</th>
                        <th>Anzahl</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="storage-body"></tbody>
            </table>
        </div>
    </main>

    <script src="storage.js" type="module"></script>
</body>
</html>
